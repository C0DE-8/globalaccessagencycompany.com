<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>veliport24 Logistics Tracking Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2.5fr) minmax(320px, 1fr);
      height: 100vh;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 60vh minmax(0, 1fr);
      }
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .side-panel {
      background: radial-gradient(circle at top, #111827, #020617);
      border-left: 1px solid rgba(55, 65, 81, 0.7);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .title {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #9ca3af;
    }

    .route-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0.25rem;
    }

    .tracker-form {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .tracker-form input {
      flex: 1;
      padding: 0.45rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 0.85rem;
      outline: none;
    }

    .tracker-form input::placeholder {
      color: #6b7280;
    }

    .tracker-form button {
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: radial-gradient(circle at top left, rgba(34, 197, 94, 0.25), #111827);
      color: #e5e7eb;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .tracker-form button:hover {
      border-color: #22c55e;
    }

    .status {
      font-size: 0.8rem;
      min-height: 1.2rem;
    }

    .status.ok    { color: #4ade80; }
    .status.error { color: #f97373; }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .step {
      border-radius: 0.75rem;
      border: 1px solid rgba(55, 65, 81, 0.9);
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
      cursor: pointer;
      transition: all 0.15s ease;
      background: rgba(15, 23, 42, 0.9);
    }

    .step:hover {
      border-color: rgba(59, 130, 246, 0.8);
      transform: translateY(-1px);
    }

    .step.active {
      border-color: #22c55e;
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.4);
    }

    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-top: 0.2rem;
      flex-shrink: 0;
    }

    .dot-start   { background: #3b82f6; }
    .dot-current { background: #22c55e; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.2); }
    .dot-dest    { background: #f97316; }

    .step-title {
      font-weight: 500;
    }

    .step-meta {
      font-size: 0.78rem;
      color: #9ca3af;
    }

    .progress-wrap {
      margin-top: 0.5rem;
    }

    .progress-label {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 0.25rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #111827;
      overflow: hidden;
    }

    .progress-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #2dd4bf);
      transition: width 0.2s ease;
    }

    .hint {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }

    #btnNext {
      margin-top: auto;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: radial-gradient(circle at top left, rgba(34, 197, 94, 0.25), #111827);
      color: #e5e7eb;
      cursor: pointer;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      justify-content: center;
    }
    #btnNext:hover {
      border-color: #22c55e;
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- MAP -->
    <div id="map"></div>

    <!-- SIDE INFO -->
    <aside class="side-panel">
      <div>
        <div class="title">Load route</div>
        <div class="route-name" id="routeName">Enter tracker number</div>

        <div class="tracker-form">
          <input id="trackerInput" type="text" placeholder="e.g. TRK-1023" />
          <button id="btnTrack">Track</button>
        </div>
        <div id="statusMessage" class="status"></div>
      </div>

      <div class="steps" id="steps">
        <!-- Steps injected by JS -->
      </div>

      <div class="progress-wrap">
        <div class="progress-label">Journey progress</div>
        <div class="progress-bar">
          <div class="progress-inner" id="progressInner"></div>
        </div>
        <div class="hint">Click a step or marker – it will highlight here.</div>
      </div>

      <button id="btnNext">
        ▶ Move load to next part
      </button>
    </aside>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // Base API URL for your backend
    const API_BASE = 'https://api.veliport24.com/api/packages';

    // Route data (will be updated from API)
    let routePoints = [];
    let currentIndex = 1; // 0 = start, 1 = current, 2 = destination

    // Leaflet map setup - world-ish start (Atlantic)
    const map = L.map("map").setView([10, -20], 3);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function makeIcon(color) {
      return L.divIcon({
        className: "",
        html: `
          <div style="
            width:16px;height:16px;border-radius:999px;
            background:${color};
            border:2px solid #020617;
            box-shadow:0 0 0 6px rgba(15,23,42,0.6);
          "></div>
        `,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });
    }

    const icons = {
      start: makeIcon("#3b82f6"),
      current: makeIcon("#22c55e"),
      destination: makeIcon("#f97316")
    };

    let markers = {};
    let polyline = null;

    const stepsContainer   = document.getElementById("steps");
    const progressInner    = document.getElementById("progressInner");
    const routeNameEl      = document.getElementById("routeName");
    const statusMessageEl  = document.getElementById("statusMessage");

    const trackerInput = document.getElementById("trackerInput");
    const btnTrack     = document.getElementById("btnTrack");
    const btnNext      = document.getElementById("btnNext");

    function setStatus(msg, type = "") {
      statusMessageEl.textContent = msg || "";
      statusMessageEl.className = "status" + (type ? " " + type : "");
    }

    // Simple mock "geocoder" that maps words in address to coordinates.
    // Still kept as fallback if real geocode fails.
    function mockGeocode(address) {
      if (!address) {
        return { lat: 9.0820, lng: 8.6753 }; // default near Nigeria
      }
      const a = address.toLowerCase();

      // ===== NIGERIA / AFRICA =====
      if (a.includes("ikeja")) {
        return { lat: 6.6018, lng: 3.3515 };
      }
      if (a.includes("lagos")) {
        return { lat: 6.5244, lng: 3.3792 };
      }
      if (a.includes("ikorodu")) {
        return { lat: 6.6194, lng: 3.5105 };
      }
      if (a.includes("ogijo") || a.includes("sagamu")) {
        return { lat: 6.7360, lng: 3.5280 };
      }
      if (a.includes("abuja")) {
        return { lat: 9.0765, lng: 7.3986 };
      }
      if (a.includes("ibadan")) {
        return { lat: 7.3775, lng: 3.9470 };
      }
      if (a.includes("accra") || a.includes("ghana")) {
        return { lat: 5.6037, lng: -0.1870 };
      }
      if (a.includes("nairobi") || a.includes("kenya")) {
        return { lat: -1.2864, lng: 36.8172 };
      }
      if (a.includes("johannesburg") || a.includes("south africa")) {
        return { lat: -26.2041, lng: 28.0473 };
      }

      // ===== BRAZIL =====
      if (a.includes("brasil") || a.includes("brazil") || a.includes("são paulo") || a.includes("sao paulo")) {
        return { lat: -23.5505, lng: -46.6333 }; // São Paulo
      }
      if (a.includes("rio de janeiro")) {
        return { lat: -22.9068, lng: -43.1729 };
      }

      // ===== UNITED STATES =====
      if (a.includes("compton") || a.includes("artesia blvd")) {
        return { lat: 33.8958, lng: -118.2201 }; // Compton, CA
      }
      if (a.includes("los angeles") || a.includes("la, ca")) {
        return { lat: 34.0522, lng: -118.2437 };
      }
      if (a.includes("houston") || a.includes("tx")) {
        return { lat: 29.7604, lng: -95.3698 };
      }
      if (a.includes("chicago") || a.includes("illinois")) {
        return { lat: 41.8781, lng: -87.6298 };
      }
      if (a.includes("atlanta") || a.includes("georgia")) {
        return { lat: 33.7490, lng: -84.3880 };
      }
      if (a.includes("miami") || a.includes("florida")) {
        return { lat: 25.7617, lng: -80.1918 };
      }
      if (a.includes("jfk") || a.includes("john f. kennedy") || a.includes("queens")) {
        return { lat: 40.6413, lng: -73.7781 }; // JFK Airport
      }
      if (a.includes("new york") || a.includes("ny ")) {
        return { lat: 40.7128, lng: -74.0060 };
      }
      if (a.includes("usa") || a.includes("united states")) {
        return { lat: 39.8283, lng: -98.5795 }; // USA centre
      }

      // ===== CANADA – PRINCE EDWARD ISLAND & GENERAL =====
      if (a.includes("vernon river") || a.includes("c0a2e0") || a.includes("c0a 2e0")) {
        return { lat: 46.2103, lng: -62.8365 }; // Vernon River, PEI
      }
      if (a.includes("china point")) {
        return { lat: 46.1954, lng: -62.8032 }; // China Point Rd area
      }
      if (a.includes("charlottetown")) {
        return { lat: 46.2382, lng: -63.1311 }; // PEI capital
      }
      if (a.includes("toronto") || a.includes("ontario")) {
        return { lat: 43.6532, lng: -79.3832 };
      }
      if (a.includes("vancouver") || a.includes("british columbia") || a.includes("bc")) {
        return { lat: 49.2827, lng: -123.1207 };
      }
      if (a.includes("montreal") || a.includes("quebec")) {
        return { lat: 45.5017, lng: -73.5673 };
      }
      if (a.includes("canada")) {
        return { lat: 56.1304, lng: -106.3468 };
      }

      // ===== UK / EUROPE =====
      if (a.includes("london") || a.includes("united kingdom") || a.includes("england") || a.includes("uk")) {
        return { lat: 51.5074, lng: -0.1278 };
      }
      if (a.includes("manchester")) {
        return { lat: 53.4808, lng: -2.2426 };
      }
      if (a.includes("paris") || a.includes("france")) {
        return { lat: 48.8566, lng: 2.3522 };
      }
      if (a.includes("berlin") || a.includes("germany")) {
        return { lat: 52.5200, lng: 13.4050 };
      }
      if (a.includes("amsterdam") || a.includes("netherlands")) {
        return { lat: 52.3676, lng: 4.9041 };
      }
      if (a.includes("madrid") || a.includes("spain")) {
        return { lat: 40.4168, lng: -3.7038 };
      }
      if (a.includes("rome") || a.includes("italy")) {
        return { lat: 41.9028, lng: 12.4964 };
      }

      // ===== MIDDLE EAST =====
      if (a.includes("dubai") || a.includes("uae") || a.includes("united arab emirates")) {
        return { lat: 25.2048, lng: 55.2708 };
      }
      if (a.includes("riyadh") || a.includes("saudi arabia")) {
        return { lat: 24.7136, lng: 46.6753 };
      }

      // ===== ASIA =====
      if (a.includes("tokyo") || a.includes("japan")) {
        return { lat: 35.6762, lng: 139.6503 };
      }
      if (a.includes("beijing") || a.includes("china")) {
        return { lat: 39.9042, lng: 116.4074 };
      }
      if (a.includes("mumbai") || a.includes("bombay")) {
        return { lat: 19.0760, lng: 72.8777 };
      }
      if (a.includes("delhi") || a.includes("new delhi") || a.includes("india")) {
        return { lat: 28.6139, lng: 77.2090 };
      }
      if (a.includes("singapore")) {
        return { lat: 1.3521, lng: 103.8198 };
      }

      // fallback: mid-Atlantic so long routes look okay
      return { lat: 10, lng: -20 };
    }

    // 🔹 Real geocode using OpenStreetMap Nominatim (no key needed for light use)
    async function geocodeAddress(address) {
      if (!address) {
        return { lat: 9.0820, lng: 8.6753 };
      }

      try {
        const res = await axios.get('https://nominatim.openstreetmap.org/search', {
          params: {
            q: address,
            format: 'json',
            limit: 1
          }
        });

        const data = res.data;
        if (Array.isArray(data) && data.length > 0) {
          return {
            lat: parseFloat(data[0].lat),
            lng: parseFloat(data[0].lon)
          };
        }
      } catch (err) {
        console.error('Geocode error for:', address, err);
      }

      // If real geocode fails, fall back to mock
      return mockGeocode(address);
    }

    // Build route points from package data returned by the API
    async function buildRouteFromPackage(pkg) {
      const senderAddr    = pkg.sender_address    || "Sender address";
      const recipientAddr = pkg.recipient_address || "Recipient address";

      // Support BOTH `current_location` and `location` fields from DB
      const rawCurrent  = pkg.current_location || pkg.location;
      const currentText = rawCurrent || "On-route between sender and recipient";

      // Start coords: use DB lat/lng if present, otherwise geocode
      let startCoords;
      if (pkg.sender_lat && pkg.sender_lng) {
        startCoords = { lat: pkg.sender_lat, lng: pkg.sender_lng };
      } else {
        startCoords = await geocodeAddress(senderAddr);
      }

      // Destination coords
      let destCoords;
      if (pkg.recipient_lat && pkg.recipient_lng) {
        destCoords = { lat: pkg.recipient_lat, lng: pkg.recipient_lng };
      } else {
        destCoords = await geocodeAddress(recipientAddr);
      }

      // Current location coords:
      let currentCoords;
      if (pkg.current_lat && pkg.current_lng) {
        currentCoords = { lat: pkg.current_lat, lng: pkg.current_lng };
      } else {
        currentCoords = await geocodeAddress(currentText);
      }

      routeNameEl.textContent = `${senderAddr} ➜ ${recipientAddr}`;

      routePoints = [
        {
          id: "start",
          label: "Start",
          place: senderAddr,
          description: "Package picked up from sender address.",
          lat: startCoords.lat,
          lng: startCoords.lng
        },
        {
          id: "current",
          label: "Current position",
          place: currentText,
          description: rawCurrent
            ? `Current location: ${currentText}`
            : "Estimated current position of the load.",
          lat: currentCoords.lat,
          lng: currentCoords.lng
        },
        {
          id: "destination",
          label: "Destination",
          place: recipientAddr,
          description: "Recipient address / final location.",
          lat: destCoords.lat,
          lng: destCoords.lng
        }
      ];
      currentIndex = 1;
    }

    function clearMapLayers() {
      Object.values(markers).forEach(marker => map.removeLayer(marker));
      markers = {};
      if (polyline) {
        map.removeLayer(polyline);
        polyline = null;
      }
    }

    function renderMap() {
      clearMapLayers();
      if (!routePoints.length) return;

      routePoints.forEach(pt => {
        const marker = L.marker([pt.lat, pt.lng], { icon: icons[pt.id] }).addTo(map);
        marker.bindPopup(`<strong>${pt.label}</strong><br>${pt.place}`);
        marker.on("click", () => {
          currentIndex = routePoints.findIndex(p => p.id === pt.id);
          updateUI();
        });
        markers[pt.id] = marker;
      });

      polyline = L.polyline(
        routePoints.map(p => [p.lat, p.lng]),
        { color: "#22c55e", weight: 4, opacity: 0.7 }
      ).addTo(map);

      map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
    }

    function buildSteps() {
      stepsContainer.innerHTML = "";
      routePoints.forEach((pt, index) => {
        const div = document.createElement("div");
        div.className = "step";
        div.dataset.index = index;

        const dot = document.createElement("div");
        dot.className =
          "step-dot " +
          (pt.id === "start"
            ? "dot-start"
            : pt.id === "current"
            ? "dot-current"
            : "dot-dest");

        const body = document.createElement("div");
        body.innerHTML = `
          <div class="step-title">${pt.label}</div>
          <div class="step-meta">${pt.place}</div>
          <div class="step-meta">${pt.description}</div>
        `;

        div.appendChild(dot);
        div.appendChild(body);

        div.addEventListener("click", () => {
          currentIndex = index;
          updateUI();
        });

        stepsContainer.appendChild(div);
      });
    }

    function updateUI() {
      if (!routePoints.length) return;

      const stepEls = stepsContainer.querySelectorAll(".step");
      stepEls.forEach((el, idx) => {
        el.classList.toggle("active", idx === currentIndex);
      });

      const progressPercent = (currentIndex / (routePoints.length - 1)) * 100;
      progressInner.style.width = progressPercent + "%";

      const pt = routePoints[currentIndex];
      map.setView([pt.lat, pt.lng], 4);
      const marker = markers[pt.id];
      if (marker) {
        marker.openPopup();
      }
    }

    // Demo route if API fails
    async function useDemoRoute() {
      const demoPackage = {
        sender_address:   "Fulfillment Center – 1200 W Artesia Blvd, Compton, CA 90220, USA",
        current_location: "Cargo Sorting Facility, JFK Airport, Queens, NY 11430, USA",
        recipient_address:"Customer – 350 5th Ave, New York, NY 10118, USA"
      };
      await buildRouteFromPackage(demoPackage);
      buildSteps();
      renderMap();
      updateUI();
      setStatus("Showing demo US route.", "ok");
    }

    async function fetchPackage(trackerNumber) {
      try {
        setStatus("Loading package...", "");
        const url = `${API_BASE}/package/${encodeURIComponent(trackerNumber)}`;
        const response = await axios.get(url);
        const pkg = response.data.package;

        if (!pkg) {
          setStatus("Package data missing in response. Showing demo US route.", "error");
          await useDemoRoute();
          return;
        }

        await buildRouteFromPackage(pkg);
        buildSteps();
        renderMap();
        updateUI();
        setStatus(`Showing package ${trackerNumber}.`, "ok");
      } catch (err) {
        console.error(err);
        if (err.response && err.response.status === 404) {
          setStatus("Package not found. Showing demo US route.", "error");
        } else {
          setStatus("Error loading package from server. Showing demo US route.", "error");
        }
        await useDemoRoute();
      }
    }

    // Button + Enter key handlers
    btnTrack.addEventListener("click", () => {
      const t = trackerInput.value.trim();
      if (!t) {
        setStatus("Please enter a tracker number.", "error");
        return;
      }
      fetchPackage(t);
    });

    trackerInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        btnTrack.click();
      }
    });

    btnNext.addEventListener("click", () => {
      if (!routePoints.length) return;
      currentIndex = (currentIndex + 1) % routePoints.length;
      updateUI();
    });

    // 🔹 Read tracker from URL (?tracker=...) and auto-load
    const params = new URLSearchParams(window.location.search);
    const initialTracker = params.get('tracker');

    if (initialTracker) {
      trackerInput.value = initialTracker;
      fetchPackage(initialTracker);
    } else {
      // No tracker provided: show demo route
      useDemoRoute();
    }
  </script>
</body>
</html>
