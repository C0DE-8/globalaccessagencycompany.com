<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password | Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2 class="title">Change Password</h2>
      <p class="description">Requires admin key + logged in token</p>
    </div>

    <form id="form">
      <div class="form-group">
        <label for="adminKey">Admin Key Code</label>
        <input type="password" id="adminKey" placeholder="Enter key code" required>
      </div>

      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" placeholder="Current password" required>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="min 6 chars" required>
      </div>

      <button type="submit" class="btn" id="btn">
        <span class="spinner" id="spinner"></span>
        Update Password
      </button>
    </form>

    <div class="message" id="message"></div>

    <div class="card-footer">
      <a href="login.html">Back to Login</a>
      &nbsp;•&nbsp;
      <a href="dashboard.html">Go Dashboard</a>
    </div>
  </div>

  <script>
    const API_BASE = "https://api.veliport24.com";
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const spinner = document.getElementById("spinner");
    const message = document.getElementById("message");

    function getToken() {
      return localStorage.getItem("token") || "";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const token = getToken();
      if (!token) {
        message.textContent = "You must login first.";
        message.className = "message error";
        return;
      }

      const adminKey = document.getElementById("adminKey").value.trim();
      const currentPassword = document.getElementById("currentPassword").value;
      const newPassword = document.getElementById("newPassword").value;

      btn.disabled = true;
      spinner.style.display = "inline-block";
      message.textContent = "";
      message.className = "message";

      try {
        // ⚠️ Your backend has: POST /api/auth/admin/change-password
        const res = await fetch(`${API_BASE}/api/auth/change-password`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ adminKey, currentPassword, newPassword })
        });

        const data = await res.json();

        if (!res.ok) {
          message.textContent = data.message || "Change password failed.";
          message.classList.add("error");
          return;
        }

        message.textContent = "Password updated successfully!";
        message.classList.add("success");
        form.reset();
      } catch (err) {
        message.textContent = "Network error. Please try again.";
        message.classList.add("error");
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
      }
    });
  </script>
</body>
</html>
