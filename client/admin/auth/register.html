<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Admin | Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2v6"/>
        <path d="M9 5h6"/>
        <rect x="4" y="8" width="16" height="14" rx="2"/>
      </svg>
      <h2 class="title">Register Admin</h2>
      <p class="description">Key code required</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label for="adminKey">Admin Key Code</label>
        <input type="password" id="adminKey" placeholder="Enter key code" required>
      </div>
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" placeholder="admin@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Admin Password</label>
        <input type="password" id="password" placeholder="min 6 chars" required>
      </div>

      <button type="submit" class="btn" id="btn">
        <span class="spinner" id="spinner"></span>
        Create Admin
      </button>
    </form>

    <div class="message" id="message"></div>

    <div class="card-footer">
      Already have an admin?
      <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script>
    const API_BASE = "https://api.veliport24.com";
    const form = document.getElementById("registerForm");
    const btn = document.getElementById("btn");
    const spinner = document.getElementById("spinner");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const adminKey = document.getElementById("adminKey").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      spinner.style.display = "inline-block";
      message.textContent = "";
      message.className = "message";

      try {
        // ⚠️ Your backend has: router.post("/admin/register", ...)
        // If you changed it to router.post("/register", ...) then keep /register.
        // I’ll use what the router SHOULD be: /admin/register
        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ adminKey, email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          message.textContent = data.message || "Register failed.";
          message.classList.add("error");
          return;
        }

        message.textContent = "Admin created successfully! Go login.";
        message.classList.add("success");

        setTimeout(() => window.location.href = "login.html", 900);
      } catch (err) {
        message.textContent = "Network error. Please try again.";
        message.classList.add("error");
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
      }
    });
  </script>
</body>
</html>
